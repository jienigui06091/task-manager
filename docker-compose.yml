services:
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/jienigui06091/task-manager-api:latest}
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-taskDB}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/jienigui06091/task-manager-frontend:latest}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - backend
