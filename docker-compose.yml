services:
  postgres:
    image: ${POSTGRES_IMAGE:-ghcr.io/jienigui06091/task-manager-postgres:latest}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-task_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-postgres-password}
      POSTGRES_DB: ${POSTGRES_DB:-task_manager}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/jienigui06091/task-manager-api:latest}
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-task_manager}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-this-postgres-password}
      DB_NAME: ${POSTGRES_DB:-task_manager}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/jienigui06091/task-manager-frontend:latest}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
